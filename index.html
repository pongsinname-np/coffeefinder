<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Finder</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #f5f3f0 0%, #efe8e0 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    
    .header {
      text-align: center;
      margin-bottom: 40px;
      padding: 20px 0;
    }
    
    .header h1 {
      font-size: 32px;
      color: #2c2c2c;
      margin-bottom: 10px;
    }
    
    .header p {
      font-size: 14px;
      color: #666;
    }
    
    .section {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    
    .section h2 {
      font-size: 16px;
      color: #2c2c2c;
      margin-bottom: 16px;
      font-weight: 500;
    }
    
    .form-group {
      margin-bottom: 16px;
    }
    
    .form-group label {
      display: block;
      font-size: 14px;
      color: #666;
      margin-bottom: 8px;
      font-weight: 500;
    }
    
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
    }
    
    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #8B6F47;
      box-shadow: 0 0 0 3px rgba(139, 111, 71, 0.1);
    }
    
    .search-controls {
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }
    
    .search-controls .form-group {
      flex: 1;
      margin-bottom: 0;
    }
    
    button {
      padding: 12px 24px;
      background: #8B6F47;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.2s;
    }
    
    button:hover:not(:disabled) {
      background: #6d5839;
    }
    
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    
    .status {
      font-size: 14px;
      color: #666;
      margin-top: 8px;
      min-height: 20px;
    }
    
    .status.loading {
      color: #8B6F47;
    }
    
    .status.error {
      color: #d32f2f;
    }
    
    .status.success {
      color: #2e7d32;
    }
    
    .results {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      margin-top: 24px;
    }
    
    .result-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border-left: 4px solid #8B6F47;
    }
    
    .result-card h3 {
      font-size: 16px;
      color: #2c2c2c;
      margin-bottom: 12px;
      font-weight: 500;
    }
    
    .result-text {
      font-size: 14px;
      color: #666;
      line-height: 1.6;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #999;
    }
    
    .empty-state p {
      font-size: 14px;
    }
    
    .info-box {
      background: #f5f3f0;
      border-left: 4px solid #8B6F47;
      padding: 12px;
      border-radius: 4px;
      font-size: 13px;
      color: #666;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>☕ Coffee Finder</h1>
      <p>AI-powered coffee search and recommendations</p>
    </div>
    
    <div class="section">
      <h2>Setup - Gemini API Key</h2>
      <div class="info-box">
        Get your free API key from <a href="https://aistudio.google.com" target="_blank" style="color: #8B6F47;">Google AI Studio</a>. Your key stays in your browser only.
      </div>
      <div class="form-group">
        <label>Paste your Gemini API Key</label>
        <input 
          id="apiKey" 
          type="password" 
          placeholder="AIzaSy..."
        >
      </div>
    </div>
    
    <div class="section">
      <h2>Search for Coffee</h2>
      <div class="search-controls">
        <div class="form-group">
          <label>What are you looking for?</label>
          <input 
            id="query" 
            type="text" 
            placeholder="e.g., medium roast Thailand single origin"
          >
        </div>
        <button id="searchBtn" onclick="searchCoffee()">Search</button>
      </div>
      <div class="status" id="status"></div>
    </div>
    
    <div id="results" class="results"></div>
  </div>

  <script>
    async function searchCoffee() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const query = document.getElementById('query').value.trim();
      const statusEl = document.getElementById('status');
      const resultsEl = document.getElementById('results');
      const searchBtn = document.getElementById('searchBtn');
      
      if (!apiKey) {
        statusEl.textContent = '❌ Please enter your Gemini API key';
        statusEl.className = 'status error';
        return;
      }
      
      if (!query) {
        statusEl.textContent = '❌ Please enter a search query';
        statusEl.className = 'status error';
        return;
      }
      
      searchBtn.disabled = true;
      statusEl.textContent = '🔍 Searching for coffee...';
      statusEl.className = 'status loading';
      resultsEl.innerHTML = '';
      
      try {
        const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=' + apiKey, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            contents: [{
              parts: [{
                text: `Search for coffee products matching: "${query}"

List 5-7 coffee products you find. For each product, provide:
- Product name and brand
- Price
- Roast level (light/medium/dark)
- Origin (country or region)
- Tasting notes or flavor profile
- Where you found it (shop/website)
- URL link (if available)

Format as a simple numbered list. Be specific with real product names and actual information.`
              }]
            }]
          })
        });
        
        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error?.message || 'API request failed');
        }
        
        const data = await response.json();
        const content = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
        
        if (!content) {
          throw new Error('No response from API');
        }
        
        displayResults(content);
        statusEl.textContent = '✅ Results found!';
        statusEl.className = 'status success';
        
      } catch (error) {
        console.error('Error:', error);
        statusEl.textContent = '❌ ' + error.message;
        statusEl.className = 'status error';
      } finally {
        searchBtn.disabled = false;
      }
    }
    
    function displayResults(content) {
      const resultsEl = document.getElementById('results');
      resultsEl.innerHTML = `
        <div class="result-card">
          <h3>Coffee Search Results</h3>
          <div class="result-text">
            ${content.replace(/</g, '&lt;').replace(/>/g, '&gt;')}
          </div>
        </div>
      `;
    }
    
    document.getElementById('query').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        searchCoffee();
      }
    });
  </script>
</body>
</html>
